#Mouse config ---------------------
# cormoran/zmk-driver-pmw3610-with-custom-studio-rpc を使用。
# 軸の向きは devicetree ではなくここで指定する (DYA Studio から実行時変更も可)。
CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y  # この個体ではY軸は反転不要
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

# トラックボールセンサー診断 (DYA Studio の「トラックボールセンサー」タブ)
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
# CPI / 軸反転 / ダウンシフト時間などを DYA Studio から保存できるようにする
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=7
CONFIG_EC11_THREAD_STACK_SIZE=2048

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Kscan Diagnostics ----------------
# 周辺側 (左手) でもキー統計を収集し、中央側 (右手) 経由で DYA Studio に返す。
# CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN は左右で同じ値にする必要がある。
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

#Watchdog -------------------------
# 周辺側 (左手) も自分自身のインシデントを記録する。
# 中央側から中継して DYA Studio の「安定性」タブで
# "Peripheral" を選ぶと参照できる。
CONFIG_ZMK_WATCHDOG=y
